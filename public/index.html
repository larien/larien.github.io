<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lauren Ferreira — Golang developer · larien.dev</title>
  <meta name="description" content="Lauren Ferreira (@larienmf) — Golang developer based in Florianópolis, Brazil, building Nomu.land, a travel app. Blog, LinkedIn and a map of every trip.">
  <meta name="author" content="Lauren Ferreira">
  <link rel="canonical" href="https://larien.dev/">
  <meta name="theme-color" content="#0A0E14">
  <meta name="color-scheme" content="dark light">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="larien.dev">
  <meta property="og:url" content="https://larien.dev/">
  <meta property="og:title" content="Lauren Ferreira — Golang developer">
  <meta property="og:description" content="Golang developer based in Florianópolis, Brazil, building Nomu.land, a travel app.">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="pt_BR">
  <meta property="og:locale:alternate" content="es_ES">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@larienmf">
  <meta name="twitter:creator" content="@larienmf">
  <meta name="twitter:title" content="Lauren Ferreira — Golang developer">
  <meta name="twitter:description" content="Golang developer based in Florianópolis, Brazil, building Nomu.land, a travel app.">

  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">

  <script>
    // Resolve theme / accent / language before first paint (no flash).
    // Stored choice wins; otherwise system theme + navigator.language.
    (function () {
      var d = document.documentElement;
      function get(k) { try { return localStorage.getItem('larien.' + k); } catch (e) { return null; } }
      var th = get('theme');
      if (th !== 'dark' && th !== 'light') {
        th = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      var ac = get('accent');
      if (['blue', 'indigo', 'teal', 'coral', 'violet', 'amber'].indexOf(ac) < 0) ac = 'blue';
      var lg = get('lang');
      if (['en', 'pt', 'es'].indexOf(lg) < 0) {
        var nl = (navigator.language || 'en').toLowerCase();
        lg = nl.indexOf('pt') === 0 ? 'pt' : nl.indexOf('es') === 0 ? 'es' : 'en';
      }
      d.className = th + ' acc-' + ac;
      d.setAttribute('data-lang', lg);
      d.lang = { en: 'en', pt: 'pt-BR', es: 'es' }[lg];
    })();
  </script>

  <style>
    /* Design tokens (design/reference.html). Dark is the no-JS default
       unless the system asks for light. Dark --dim is #7C8898 (reference
       #6E7A8A) so it clears 4.5:1 on the glass panels. */
    :root {
      color-scheme: dark;
      --glass: rgba(10, 14, 20, 0.8); --veil: rgba(10, 14, 20, 0.55);
      --bg: #0A0E14; --panel: #0D121A; --card: #0F1A26; --fg: #F0F3F6; --text: #C9D1D9;
      --muted: #8B96A5; --dim: #7C8898; --line: #1B2230; --border: #263042; --grid: #2A3444;
      --accent: #1DA1EB; --accentHover: #7CCBF5;
    }
    :root.light {
      color-scheme: light;
      --glass: rgba(255, 255, 255, 0.86); --veil: rgba(246, 248, 250, 0.5);
      --bg: #F6F8FA; --panel: #FFFFFF; --card: #EAF4FB; --fg: #11161D; --text: #2B323B;
      --muted: #57606A; --dim: #636C76; --line: #D8DEE4; --border: #C9D1D9; --grid: #D0D7DE;
      --accent: #0B6FB5; --accentHover: #08528A;
    }
    @media (prefers-color-scheme: light) {
      :root:not(.dark):not(.light) {
        color-scheme: light;
        --glass: rgba(255, 255, 255, 0.86); --veil: rgba(246, 248, 250, 0.5);
        --bg: #F6F8FA; --panel: #FFFFFF; --card: #EAF4FB; --fg: #11161D; --text: #2B323B;
        --muted: #57606A; --dim: #636C76; --line: #D8DEE4; --border: #C9D1D9; --grid: #D0D7DE;
        --accent: #0B6FB5; --accentHover: #08528A;
      }
    }
    /* Accents: a fixed palette, each checked at >= 4.5:1 in both themes. */
    :root.dark.acc-indigo { --accent: #7B93FF; --accentHover: #AFBEFF; } :root.light.acc-indigo { --accent: #3A56D5; --accentHover: #2B41A8; }
    :root.dark.acc-teal   { --accent: #2DD4BF; --accentHover: #8BEADF; } :root.light.acc-teal   { --accent: #0F766E; --accentHover: #0B5A54; }
    :root.dark.acc-coral  { --accent: #FF7A6B; --accentHover: #FFB0A6; } :root.light.acc-coral  { --accent: #C2410C; --accentHover: #9A3412; }
    :root.dark.acc-violet { --accent: #B794F6; --accentHover: #D6C2FA; } :root.light.acc-violet { --accent: #7C3AED; --accentHover: #5B21B6; }
    :root.dark.acc-amber  { --accent: #F5B83D; --accentHover: #F9D488; } :root.light.acc-amber  { --accent: #A15C07; --accentHover: #7A4505; }
    /* Swatch colors in the accent picker follow the current theme. */
    .sw-blue { --sw: #1DA1EB; } .sw-indigo { --sw: #7B93FF; } .sw-teal { --sw: #2DD4BF; }
    .sw-coral { --sw: #FF7A6B; } .sw-violet { --sw: #B794F6; } .sw-amber { --sw: #F5B83D; }
    :root.light .sw-blue { --sw: #0B6FB5; } :root.light .sw-indigo { --sw: #3A56D5; } :root.light .sw-teal { --sw: #0F766E; }
    :root.light .sw-coral { --sw: #C2410C; } :root.light .sw-violet { --sw: #7C3AED; } :root.light .sw-amber { --sw: #A15C07; }

    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font-family: 'JetBrains Mono', ui-monospace, monospace; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accentHover); text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* Static fallback: what crawlers and no-JS visitors get. Vue replaces it. */
    .sf { min-height: 100vh; box-sizing: border-box; display: flex; align-items: center; padding: 24px clamp(16px, 5vw, 72px); max-width: 1440px; margin: 0 auto; }
    .sf-panel { max-width: 720px; display: flex; flex-direction: column; gap: 16px; padding: clamp(20px, 3vw, 40px); border: 1px solid var(--line); border-radius: 18px; background: var(--panel); font-size: clamp(16px, 1.4vw, 19px); line-height: 1.6; }
    .sf-panel h1 { margin: 0; font-size: clamp(34px, 4vw, 56px); line-height: 1.15; color: var(--fg); letter-spacing: -0.02em; }
    .sf-panel p { margin: 0; }
    .sf-dim { color: var(--dim); }
    .sf-muted { color: var(--muted); }
    .sf-panel ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 24px; }
    .sf-panel li a { display: inline-flex; align-items: center; min-height: 44px; }
  </style>
</head>
<body>
  <div id="app">
    <main class="sf">
      <div class="sf-panel">
        <p><span class="sf-dim">~/larien.dev $</span> whoami</p>
        <h1>Hello! Call me <span style="color: var(--accent)">Lauren</span>,</h1>
        <p style="color: var(--fg)">a Golang developer building <a href="https://nomu.land">Nomu.land</a>, a travel app.</p>
        <p class="sf-muted">based in Florianópolis, Brazil</p>
        <p><span class="sf-dim">~/larien.dev $</span> ls projects/</p>
        <ul>
          <li><a href="https://nomu.land">nomu.land/</a></li>
          <li><a href="https://blog.larien.dev">blog/</a></li>
          <li><a href="https://linkedin.larien.dev">linkedin/</a></li>
        </ul>
        <p class="sf-dim" style="font-size: 12px">© 2026 Lauren Ferreira · @larienmf · LARIEN DEV LTDA</p>
      </div>
    </main>
  </div>
</body>
</html>
