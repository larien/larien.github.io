name: Deploy to GitHub Pages

# Pages serves the gh-pages branch (Settings → Pages → "Deploy from a branch").
# Pushes to main build and publish; pull requests only build, as a check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to gh-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare Pages output
        run: |
          # Keep the custom domain even if the build didn't ship a CNAME.
          [ -f dist/CNAME ] || echo "larien.dev" > dist/CNAME
          touch dist/.nojekyll
          test -f dist/index.html
          echo "CNAME: $(cat dist/CNAME)"

      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy ${{ github.sha }}"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "Deployed ${{ github.sha }} to gh-pages → https://$(cat dist/CNAME)" >> "$GITHUB_STEP_SUMMARY"
